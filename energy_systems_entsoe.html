
<!DOCTYPE html>

<style>
  :root {
    --bg-page: #f4f5f7;
    --bg-card: #ffffff;
    --border-soft: #e0e3e8;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --text-main: #111827;
    --text-muted: #6b7280;
    --table-header: #f3f4f6;
    --chip: #eef2ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 16px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background-color: var(--bg-page);
    color: var(--text-main);
  }

  .report-container {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--bg-card);
    border-radius: 12px;
    padding: 28px 32px 36px;
    box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
  }

  header {
    text-align: center;
    padding: 20px 0 10px;
  }

  header .label {
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6b7280;
    margin-bottom: 12px;
  }

  header h1 {
    font-size: 1.4rem;
    font-weight: 800;
    margin: 0 0 12px;
    line-height: 1.25;
  }

  header p {
    margin: 0 auto;
    color: #6b7280;
    font-size: 0.95rem;
  }

  .meta {
    text-align: center;
    font-size: 0.8rem;
    color: #9ca3af;
    margin-top: 10px;
    margin-bottom: 0;
    font-weight: 600;
  }

h2 {
  margin-top: 24px;
  margin-bottom: 8px;
  font-size: 0.95rem;
  font-weight: 700;
  border-bottom: 1px solid var(--border-soft);
  padding-bottom: 4px;
}

p {
  font-size: 0.97rem;
  line-height: 1.7;
  margin: 6px 0 10px 0;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0px 0 16px;
  justify-content: center;
}

.chip {
  background: var(--chip);
  border: 1px solid rgba(37, 99, 235, 0.15);
  color: #1f2a5a;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 650;
  white-space: nowrap;
}

.kpi-grid {
  display: grid;
  justify-content: center;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-top: 10px;
  margin-bottom: 10px;
}

.kpi-card {
  background: var(--accent-soft);
  border-radius: 10px;
  padding: 10px 12px;
  text-align: center;
  border: 1px solid rgba(37, 99, 235, 0.35);
}

.kpi-label {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.kpi-value {
  font-size: 1.1rem;
  font-weight: 600;
}

@media (max-width: 600px) {
  .viz-block {
    max-width: 100%;
    padding: 12px;
  }
}

.tables-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
  margin-top: 10px;
  margin-bottom: 16px;
}

.table-card {
  background: #ffffff;
  border-radius: 10px;
  border: 1px solid var(--border-soft);
  padding: 10px 12px;
  overflow: auto;
}

.table-card h3 {
  margin-top: 0;
  margin-bottom: 6px;
  font-size: 1rem;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
  min-width: 640px;
}

th, td {
  border: 1px solid var(--border-soft);
  padding: 6px 8px;
  text-align: left;
  white-space: nowrap;
}

th {
  background-color: var(--table-header);
  font-weight: 600;
}
  
ul {
  margin-left: 20px;
  margin-top: 6px;
  margin-bottom: 8px;
}
  
ol {
  margin-left: 20px;
}
  
li {
  font-size: 0.97rem;
  line-height: 1.7;
}
  
.limitations {
  margin-top: 22px;
  padding-top: 12px;
  border-top: 1px solid var(--border-soft);
  color: var(--text-muted);
  font-size: 0.92rem;
  line-height: 1.4;
}
  
footer {
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1px solid #e0e3e8;
  text-align: center;
  font-size: 0.75rem;
  color: #9ca3af;
}
  
.tableau-container {
  margin-top: 16px;
  text-align: center;
}
  
h2 + ol,
p + ol {
  margin-top: 14px;
  margin-bottom: 18px;
}
  
ol li {
  margin-bottom: 8px;
}
  
sup {
  font-size: 0.75em;
}

sup a {
  text-decoration: none;
}

a, a:visited, a:hover, a:active {
  color: #2563eb;
}
</style>

</head>
