<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Reports</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  background: #f4f5f7;
  color: #111827;
}

header {
  text-align: center;
  padding: 70px 20px 20px;
  background: #f4f5f7;
  position: relative;
}

header h1 {
  font-size: 2.2rem;
  font-weight: 800;
  margin: 0 0 8px;
}

header p {
  margin: 0;
  color: #6b7280;
  font-size: 0.95rem;
}

.cards-grid {
  max-width: 1100px;
  margin: 40px auto 80px;
  padding: 0 20px;
  display: grid;
  gap: 18px;
}

.card {
  background: #ffffff;
  border-radius: 10px;
  padding: 22px;
  border-left: 6px solid #2563eb;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
}

.card h2 {
  margin: 0 0 6px;
  font-size: 1.2rem;
}

.card .tagline {
  margin: 0 0 10px;
  color: #6b7280;
  font-size: 0.9rem;
}

.card .meta {
  margin: 0 0 14px;
  color: #9ca3af;
  font-size: 0.8rem;
}

.card a {
  text-decoration: none;
  font-weight: 700;
  font-size: 0.9rem;
  color: #2563eb;
}

.card a:hover {
  text-decoration: underline;
}

.pill {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 999px;
  background: #f3f4f6;
  color: #6b7280;
  margin-right: 6px;
  font-size: 0.75rem;
}

footer {
  text-align: center;
  font-size: 0.75rem;
  color: #9ca3af;
  padding-bottom: 30px;
}

@media (max-width: 600px) {
.card { padding: 26px 24px; }

</style>
</head>

<body>

<header>
  <h1>Reports</h1>
  <p>Research reports on electricity systems and markets.</p>
</header>

<div class="cards-grid">

  <article class="card">
    <h2>East Africa Electricity Generation</h2>
    <p class="tagline">
      Generation mix, concentration risk, and regional trade (2017–2022).
    </p>
    <p class="meta">
      <span class="pill">Ember Energy</span>
    </p>

    <a href="East Africa Electricity Generation.html" target="_blank">
      View report
    </a>
  </article>

</div>

<footer>
<a href="index.html">← Back to home</a>
</footer>

</body>
</html>
