<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Electricity & Economy – Data Reports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
 body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  background: #f4f5f7; /* same as report */
  color: #111827;
}

header {
  text-align: center;
  padding: 70px 20px 20px;
  background: #f4f5f7;
  position: relative;
}

header h1 {
  font-size: 2.4rem;
  font-weight: 800;
  margin: 0 0 8px;
}

header p {
  margin: 0;
  color: #6b7280;
  font-size: 0.95rem;
}

.cards-grid {
  max-width: 1100px;
  margin: 10px auto 80px;
  padding: 0 20px;
  display: grid;
  gap: 18px;
}

.card {
  background: #ffffff;
  border-radius: 10px;
  padding: 22px;
  border-left: 6px solid #2563eb; /* ties to report accent */
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  text-align: left;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
}

.card h2 {
  margin: 0 0 6px;
  font-size: 1.2rem;
  font-weight: 700;
  text-align: left;
}

.card .tagline {
  margin: 0 0 10px;
  color: #6b7280;
  font-size: 0.9rem;
}

.card .meta {
  margin: 0 0 14px;
  color: #9ca3af;
  font-size: 0.8rem;
}

.card a {
  text-decoration: none;
  font-weight: 700;
  font-size: 0.9rem;
  color: #2563eb;
}

.card a:hover {
  text-decoration: underline;
}

footer {
  text-align: center;
  font-size: 0.75rem;
  color: #9ca3af;
  padding-bottom: 30px;
}
 .section-wrap {
    max-width: 1100px;
    margin: 34px auto 0;
    padding: 0 20px;
  }

  .section-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 12px;
  }

  .section-title h2 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.2px;
  }

  .section-title p {
    margin: 0;
    color: #6b7280;
    font-size: 0.9rem;
  }

  /* Slightly different accents per section */
  .card.brief { border-left-color: #10b981; }     /* green */
  .card.tech  { border-left-color: #7c3aed; }     /* purple */

  .meta .pill {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
    background: #f5f6f8;
    color: #6b7280;
    margin-right: 6px;
    font-weight: 650;
    font-size: 0.75rem;
  }

  .links a { margin-right: 12px; }
  
  @media (max-width: 600px) {
  .card { padding: 26px 24px; }
}
</style>
</head>
<body>
  <header>
    <h1>Electricity &amp; The Economy</h1>

<main>

<section class="section-wrap">

  <div class="cards-grid">

    <article class="card">
      <h2>Energy Systems</h2>
      <p class="tagline">Analysis of electricity systems and markets.</p>
      <div class="links">
        <a href="energy_systems.html">View reports</a>
      </div>
    </article>

    <article class="card brief">
      <h2>Market Insights</h2>
      <p class="tagline">Short notes on market events and system behavior.</p>
      <div class="links">
        <a href="market_insights.html">View insights</a>
      </div>
    </article>

    <article class="card tech">
      <h2>Technical Appendix</h2>
      <p class="tagline">Data pipelines, validation, and methodology notes.</p>
      <div class="links">
        <a href="technical_appendix.html">View appendix</a>
      </div>
    </article>
    

  </div>
</section>
</main>

  <footer>
    &copy; <!--2026--> Gina Sengeri. 
  </footer>
</body>
</html>
