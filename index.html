<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Energy, Finance and Economics – Data Reports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  background: #f4f5f7;
  color: #111827;
}

header {
  text-align: center;
  padding: 70px 20px 30px;
  background: #f4f5f7;
  position: relative;
}

header h1 {
  font-size: 2.4rem;
  font-weight: 800;
  margin: 0 0 8px;
}

header p {
  margin: 0;
  color: #6b7280;
  font-size: 0.95rem;
}

.section-wrap {
  max-width: 1180px;
  margin: 34px auto 0;
  padding: 0 24px;
}

/* Desktop: three equally sized cards across */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin: 10px auto 80px;
}

/* Main card */
.card {
  background: rgba(55, 65, 81, 0.10);
  border: 1.5px solid #2563eb;
  border-radius: 16px;
  padding: 28px 30px;
  min-height: 110px;
  box-sizing: border-box;

  box-shadow:
    0 8px 24px rgba(15, 23, 42, 0.06),
    inset 0 1px 0 rgba(255, 255, 255, 0.35);

  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease,
    background 0.18s ease;
}

.card:hover {
  transform: translateY(-3px);
  background: rgba(55, 65, 81, 0.14);
  box-shadow:
    0 14px 34px rgba(15, 23, 42, 0.10),
    inset 0 1px 0 rgba(255, 255, 255, 0.4);
}

.card h2 {
  margin: 0 0 7px;
  font-size: 1.25rem;
  font-weight: 750;
  letter-spacing: -0.01em;
}

.card .tagline {
  margin: 0;
  color: #6b7280;
  font-size: 0.92rem;
  line-height: 1.5;
}

.card .meta {
  margin: 0 0 14px;
  color: #9ca3af;
  font-size: 0.8rem;
}

/* Full coloured borders */
.card.brief {
  border-color: #10b981;
}

.card.tech {
  border-color: #7c3aed;
}

.card-link {
  text-decoration: none;
  color: inherit;
  display: block;
}

.card a {
  text-decoration: none;
  font-weight: 700;
  font-size: 0.9rem;
  color: #2563eb;
}

.card a:hover {
  text-decoration: underline;
}

footer {
  text-align: center;
  font-size: 0.75rem;
  color: #9ca3af;
  padding-bottom: 30px;
}

/* Pills */
.meta .pill {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 999px;
  background: #f5f6f8;
  color: #6b7280;
  margin-right: 6px;
  font-weight: 650;
  font-size: 0.75rem;
}

.links a {
  margin-right: 12px;
}


/* --------------------------------
   PHONE
   Two cards on top,
   Documentation underneath
-------------------------------- */

@media (max-width: 600px) {

  header {
    padding: 48px 20px 24px;
  }

  header h1 {
    font-size: 2rem;
  }

  .section-wrap {
    padding: 0 16px;
  }

  .cards-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .card {
    min-height: 120px;
    padding: 20px 18px;
    border-width: 1.5px;
    border-radius: 13px;
  }

  .card h2 {
    font-size: 1.05rem;
  }

  .card .tagline {
    font-size: 0.84rem;
  }

  /* Documentation spans both columns */
  .card.tech {
    grid-column: 1 / -1;
  }
}


/* Very small phones */
@media (max-width: 420px) {
  .cards-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .card {
    padding: 18px 15px;
  }

  .card h2 {
    font-size: 0.98rem;
  }

  .card .tagline {
    font-size: 0.8rem;
  }
}
</style>

</head>
  
<body>
  <header>
    <h1>Energy Systems</h1>

<main>

<section class="section-wrap">

  <div class="cards-grid">
    
<a class="card-link" href="energy_systems_analysis/energy_systems_analysis.html">
    <article class="card">
      <h2>Energy Systems Analysis</h2>
      <p class="tagline">Energy systems and market designs.</p>
    </article>
    </a>
    
<a class="card-link" href="energy_modelling/energy_modelling.html">
    <article class="card brief">
      <h2>Energy Modelling</h2>
      <p class="tagline">Optimization models for energy markets.</p>
    </article>
    </a>

<!-- You can add this later if you want a documentation card in your index. You'll need to add a documentation.html pointing to the other .htmls -->
<a class="card-link" href="documentation/documentation.html">
    <article class="card tech">
      <h2>Documentation</h2>
      <p class="tagline">Technical appendices, model computation, and methodology notes.</p>
    </article>
    </a>
    

  </div>
</section>
</main>

  <footer>
    &copy; <!--2026--> Gina Sengeri. 
  </footer>
</body>
</html>
