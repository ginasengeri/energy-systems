<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Documentation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
margin:0;
background:#f4f5f7;
color:#111827;
}

header{
text-align:center;
padding:70px 20px 20px;
}

header::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 4px;
  background: #7c3aed;
  border-radius: 2px;
}

header h1 {
  font-size: 2.2rem;
  font-weight: 800;
  margin: 0 0 8px;
}

header p {
  margin: 0;
  color: #6b7280;
  font-size: 0.95rem;
}

.cards-grid{
max-width: 1100px;
margin: 10px auto 80px;
padding: 0 20px;
display:grid;
gap:18px;
}

.card{
background:#ffffff;
border-radius:10px;
padding:22px;
box-shadow:0 10px 30px rgba(15,23,42,0.08);
}

.card h2{
margin:0 0 6px;
font-size:1.2rem;
}

.card p{
margin:0 0 12px;
color:#6b7280;
font-size:0.9rem;
}

.card a{
font-weight:700;
text-decoration:none;
}

.card a:hover{
text-decoration:underline;
}

footer {
  text-align: center;
  font-size: 0.75rem;
  color: #9ca3af;
  padding-bottom: 30px;
}
  
@media (max-width: 600px) {
.card { padding: 26px 24px; }
}

.appendix-link {
  color: #7c3aed;
}

.back-link {
  color: #2563eb;
}
.card-link {
  text-decoration: none;
  color: inherit;
  display: block;
}

.card {
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.card-link:hover .card {
  transform: translateY(-3px);
  box-shadow: 0 14px 34px rgba(15, 23, 42, 0.12);
}

.back-link {
  color: #2563eb;
  text-decoration: none;
}

.back-link:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<header>
<h1>Model Reproducibility</h1>
<p>Data Validation for energy modelling.</p>
</header>

<div class="cards-grid">

<a class="card-link" href="ESS_PJM.html">
<article class="card">
<h2>Energy Storage System Model in PJM</h2>
</article>
</a>

</div>

<footer>
<a class="back-link" href="https://ginasengeri.github.io/energy-systems/documentation/index.html">← Back to Documentation</a>
</footer>

  
</body>
</html>
